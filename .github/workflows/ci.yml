name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tools

      # Golden regression tests. Each one pins a scoring bug that once changed
      # a published number, so a reintroduced bug fails here rather than on the
      # leaderboard.
      - name: Tests
        run: pytest -v

      # Datasets must satisfy their task's invariants. A defect caught here
      # cannot become a published number.
      - name: Validate datasets
        run: idrockbench validate

      # Prove the run -> record -> aggregate -> report path works, with no API
      # keys and no network.
      - name: Pipeline smoke test
        run: |
          idrockbench run --model stub --suite all --limit 5 --run-id ci --no-resume
          idrockbench report --suite all --output /tmp/results.json
          python -c "
          import json, sys
          board = json.load(open('/tmp/results.json'))
          assert board['models'], 'report produced no rows'
          for m in board['models']:
              for task, cell in m['scores'].items():
                  assert cell['n'] is not None, f'{task}: no sample size'
                  assert 'coverage' in cell, f'{task}: no coverage'
          print('pipeline ok:', len(board['models']), 'model(s)')
          "

      # Datasets used to be checked by rebuilding them from tools/build_datasets.py
      # and diffing. That builder and the raw sources under data/sources/ were
      # deleted once the datasets were final, so the files in data/ are now the
      # record rather than an output. Integrity is pinned by content hash in
      # tests/test_datasets.py instead, which the pytest step above already runs:
      # an accidental edit fails, a deliberate one updates the hash in the same
      # commit and is visible in review.
