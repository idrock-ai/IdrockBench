# Nemotron 3.5 Lightning 30B
model: nemotron-3.5-lightning:30b
provider: ollama
base_url: http://127.0.0.1:11502   # tuned bench daemon, see tools/bench_ollama.sh
name: Nemotron 3.5 Lightning 30B
organization: NVIDIA
license: nvidia-open-model
weights_url: https://huggingface.co/nvidia
params_b: 30
# Resolved from the Ollama daemon at run time and written into the manifest —
# quantisation moves scores more than most model-to-model differences.
quantization: ""

# Every model in the published suite answers under the same protocol. Probed
# per model with tools/probe_models.py; a model that cannot answer directly is
# excluded rather than scored under different rules.
reasoning: "off"

concurrency: 4

# Cap the context window. Ollama otherwise loads this model at its full 262,144
# token context, which inflates it from 17 GB to 40 GB and pushes 45% of the
# weights onto CPU on an 80 GB card. Measured effect: GPU utilisation 5%, 3.7
# minutes per reasoning item, and a stall after eight items.
#
# Nothing here needs that much room. The longest task is reasoning at
# max_tokens 8192 on prompts of a few hundred tokens, so 16384 is roughly double
# what any item can use and the model never sees a truncated context.
extra_body:
  options:
    num_ctx: 16384
