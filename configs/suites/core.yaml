# The published leaderboard suite.
name: core
description: >
  Tracks whose numbers are considered publishable. A task joins this suite only
  once its dataset validates clean and its scoring has golden tests.
tasks:
  - dtm
  - reasoning_uz
  - translation_uz
  - ifeval_uz
  - zarbulmasal
# Average whatever tracks a model has, rather than withholding the composite
# until every one is present. A model that scores on four of five tracks gets a
# composite over those four.
#
# The trade this accepts: a composite over four tracks is not strictly the same
# measurement as one over five, because the missing track is not missing at
# random — it is usually the hardest one, so a partial composite tends to flatter
# the model. That is why rows built from an incomplete set are marked as partial
# on the leaderboard and the site, with the track count shown, instead of the
# difference being silently averaged away.
require_complete: false

# Published beside the others, but kept out of the composite. The multiple
# choice riddles are the same 331 items as the free-text ones, so counting both
# would give riddles a third of the composite where every other subject gets a
# fifth. The pair is worth publishing because the gap between them is the
# result, not because both belong in an average.
reported:
  - zarbulmasal_mc
