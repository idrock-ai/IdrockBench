# IFEval-UZ — verifiable instruction following.
#
# Constraints whose kwargs are not yet localised into Uzbek are excluded and
# counted; read `constraint_coverage` beside the score. Publishing the score
# without the coverage overstates what was measured.
task: ifeval_uz
dataset: ifeval_uz.json
# 2560. The longest remaining length constraint asks for 701 words, roughly
# 1750 tokens of Uzbek, so this leaves headroom without inviting a model to
# ramble. Six prompts asking for 800 to 1200 words were moved to
# data/ifeval_uz_longform.json: they needed more than 3000 tokens each and are
# kept for a separate long-form evaluation rather than scored here.
max_tokens: 2560
options:
  score_recalibrated: true
  # Measure on parallel uz-en text and set this before publishing: Uzbek is
  # agglutinative, so an English word target is not the same instruction.
  word_count_factor: 1.0
